<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Food Delivery Time Prediction</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

    <div class="container">

        <h1>Food Delivery Time Prediction</h1>

        <p class="subtitle">
            Enter the delivery details to predict delivery time.
        </p>

        <form action="/predict" method="POST">

            <label for="distance">Distance (km)</label>

            <input
                type="number"
                id="distance"
                name="distance"
                step="any"
                min="0.01"
                placeholder="Example: 5.5"
                value="{{ distance if distance is defined else '' }}"
                required
            >

            <label for="preparation_time">
                Preparation Time (minutes)
            </label>

            <input
                type="number"
                id="preparation_time"
                name="preparation_time"
                step="any"
                min="0"
                placeholder="Example: 20"
                value="{{ preparation_time if preparation_time is defined else '' }}"
                required
            >

            <label for="courier_experience">
                Courier Experience (years)
            </label>

            <input
                type="number"
                id="courier_experience"
                name="courier_experience"
                step="any"
                min="0"
                placeholder="Example: 3"
                value="{{ courier_experience if courier_experience is defined else '' }}"
                required
            >

            <button type="submit">Predict Delivery Time</button>

        </form>

        {% if prediction is defined %}

        <div class="result">
            <h2>Prediction Result</h2>

            <p>
                Estimated Delivery Time:
                <strong>{{ prediction }} minutes</strong>
            </p>
        </div>

        {% endif %}

        {% if error is defined %}

        <div class="error">
            {{ error }}
        </div>

        {% endif %}

    </div>

</body>
</html>
